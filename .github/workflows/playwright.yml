name: Playwright Tests

on:
  push:
    branches: [main]
    paths:
      - src/runners/playwright/**
      - src/__tests__/runners/playwright/**
  pull_request:
    paths:
      - src/runners/playwright/**
      - src/__tests__/runners/playwright/**

env:
  CI: true

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Playwright runner tests
        run: node --test dist/__tests__/runners/playwright/*.test.js
